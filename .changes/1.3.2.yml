version: 1.3.2
pr_number: 32
bug_fixes:
- description: Fixes the `sub_question_key` join between responses and questions in
    `qualtrics__response`. A `null` key never matched another `null` key, so responses
    to questions without sub-questions had `null` `question_*` and `block_*` fields,
    including `question_type`. The join now treats two `null` keys as a match.
- description: Adds a fallback to the parent question in `qualtrics__response`. Some
    responses have no `sub_question_key` even though the question has sub-questions,
    such as text entry and matrix questions. These responses now take their `question_*`
    and `block_*` fields from the parent question. The fallback fills any of these
    fields that the match leaves `null`. This includes a response whose `sub_question_key`
    matches no question row.
date: '2026-10-28'
